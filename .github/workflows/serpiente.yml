# Genera la animación de la serpiente que recorre la gráfica de contribuciones
# y la publica en la rama "output", desde donde la muestra el README.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 6 * * *" # todos los días
  workflow_dispatch: # para ejecutarlo a mano desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  generar:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generar la serpiente con los colores del portafolio
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#3355ff&color_dots=#e7eaee,#c7d0ff,#8ea2ff,#3355ff,#2a44cc
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8ea2ff&color_dots=#19222f,#1e2f6b,#2a44cc,#3355ff,#8ea2ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
